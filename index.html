<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIRAGE CITY — 10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">MIRAGE CITY</span>
        <span class="pop">١٠ مواطنين</span>
      </div>
      <div class="clock">
        <span id="phaseBadge">مجتمع</span>
        <span id="dayLabel">اليوم ١</span>
        <span id="timeLabel">08:00</span>
        <span id="countdown"></span>
      </div>
      <div class="top-actions">
        <button id="speedBtn" title="السرعة">×1</button>
        <button id="pauseBtn">إيقاف</button>
      </div>
    </header>
    <main class="layout">
      <section class="stage-wrap">
        <canvas id="city" width="960" height="620"></canvas>
        <div id="speech"></div>
        <div class="livebar">
          <span class="live-dot"></span> مباشر
          <div id="ticker"></div>
        </div>
      </section>
      <aside class="panel">
        <nav class="tabs">
          <button data-tab="citizens" class="on">المواطنون</button>
          <button data-tab="profile">الملف</button>
          <button data-tab="bonds">العلاقات</button>
          <button data-tab="daily">الجريدة</button>
          <button data-tab="board">اللوحة</button>
          <button data-tab="about">عن المدينة</button>
        </nav>
        <div id="tab-citizens" class="tab on"></div>
        <div id="tab-profile" class="tab"></div>
        <div id="tab-bonds" class="tab"></div>
        <div id="tab-daily" class="tab"></div>
        <div id="tab-board" class="tab"></div>
        <div id="tab-about" class="tab">
          <h3>ميراج سيتي</h3>
          <p>عشرة مواطنين يعيشون حياتهم في مدينة بيكسل.</p>
        </div>
      </aside>
    </main>
  </div>
  <script src="city.js"></script>
</body>
</html>
